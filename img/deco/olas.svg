<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" preserveAspectRatio="none">
  <!-- Ondas de agua de la portada. Decorativas: van de fondo con aria-hidden
       en el HTML. Tres capas de azul muy claro y dos filos blancos, como el
       brillo del agua de la referencia. -->
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfe9fb" stop-opacity="0"/>
      <stop offset=".35" stop-color="#cfe9fb" stop-opacity=".75"/>
      <stop offset="1" stop-color="#b9def8" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e3f2fd" stop-opacity="0"/>
      <stop offset=".5" stop-color="#e3f2fd" stop-opacity=".9"/>
      <stop offset="1" stop-color="#d4ebfb" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="c" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9fd0f3" stop-opacity="0"/>
      <stop offset=".6" stop-color="#9fd0f3" stop-opacity=".45"/>
      <stop offset="1" stop-color="#8cc6f0" stop-opacity=".55"/>
    </linearGradient>
  </defs>
  <path fill="url(#b)" d="M0 150 C 180 90 320 60 500 110 S 820 230 1000 170 S 1160 70 1200 60 V 360 H 0 Z"/>
  <path fill="url(#a)" d="M0 210 C 200 150 360 140 540 190 S 860 290 1040 230 S 1170 150 1200 140 V 360 H 0 Z"/>
  <path fill="url(#c)" d="M0 280 C 220 230 400 230 580 265 S 900 330 1080 290 S 1180 250 1200 245 V 360 H 0 Z"/>
  <path fill="none" stroke="#fff" stroke-width="3" stroke-opacity=".9" d="M0 152 C 180 92 320 62 500 112 S 820 232 1000 172 S 1160 72 1200 62"/>
  <path fill="none" stroke="#fff" stroke-width="2" stroke-opacity=".75" d="M0 212 C 200 152 360 142 540 192 S 860 292 1040 232 S 1170 152 1200 142"/>
  <path fill="none" stroke="#bfe1f8" stroke-width="1.2" stroke-opacity=".9" d="M60 120 C 240 70 380 50 560 96 S 860 200 1040 150 S 1170 64 1200 56"/>
</svg>
